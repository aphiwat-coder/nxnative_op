name: Build NxNative IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Build Project Manually
        run: |
          mkdir -p build Output
          
          # ค้นหาไฟล์โปรเจกต์ .xcodeproj หรือ .xcworkspace ในเครื่องอัตโนมัติ
          if ls *.xcworkspace 1> /dev/null 2>&1; then
            WORKSPACE_FILE=$(ls -d *.xcworkspace | head -n 1)
            SCHEME_NAME=$(basename "$WORKSPACE_FILE" .xcworkspace)
            echo "Using Workspace: $WORKSPACE_FILE"
            
            xcodebuild -workspace "$WORKSPACE_FILE" \
                       -scheme "$SCHEME_NAME" \
                       -configuration Release \
                       -sdk iphoneos \
                       -derivedDataPath build/DerivedData \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO
          else
            PROJECT_FILE=$(ls -d *.xcodeproj | head -n 1)
            SCHEME_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
            echo "Using Project: $PROJECT_FILE"
            
            xcodebuild -project "$PROJECT_FILE" \
                       -scheme "$SCHEME_NAME" \
                       -configuration Release \
                       -sdk iphoneos \
                       -derivedDataPath build/DerivedData \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO
          fi

          # แพ็กไฟล์ .app ที่คอมไพล์ได้ให้เป็น .ipa
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/*.app build/Payload/
          cd build && zip -r ../Output/NxNative-Release.ipa Payload

      - name: Upload Real IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Release-IPA
          path: Output/*.ipa
