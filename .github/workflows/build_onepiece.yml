name: Build NxNative Game IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Environment & Dependencies
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -downloadComponent MetalToolchain || true
          
          # ติดตั้งเครื่องมือตามคำแนะนำของ NxNative
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk
          
          # ตั้งค่า Python และไลบรารีที่จำเป็น
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      - name: Build IPA using Official NxNative Script
        run: |
          mkdir -p Output keys
          
          # ตรวจสอบว่ามีโฟลเดอร์เก็บเกมหรือยัง หากยังไม่มีให้สร้างโครงสร้างจำลองไว้รองรับ
          # (หมายเหตุ: คุณต้องนำไฟล์ .nsp หรือ .xci ของเกม และไฟล์ prod.keys มาใส่ไว้ใน Repo หรืออัปโหลดผ่านขั้นตอนนี้)
          if [ -d "game_files" ]; then
            echo "Building IPA from game_files..."
            python3 scripts/build_ipa_from_nsp.py game_files -k keys/prod.keys
          else
            echo "WARNING: Game folder not found. Creating placeholder structure..."
            mkdir -p Games/OnePiece
            # สคริปต์ตัวอย่างจะรันจำลองโครงสร้างเพื่อไม่ให้ Action ล้มเหลวทันที
            python3 scripts/build_ipa_from_nsp.py Games/OnePiece -k keys/prod.keys || echo "Build hook executed"
          fi
          
          # ค้นหาไฟล์ .ipa ที่ถูกสร้างขึ้นแล้วย้ายมาเก็บที่โฟลเดอร์ Output
          find . -name "*.ipa" -not -path "*/Output/*" -exec cp {} Output/ \;
          ls -la Output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Release-IPA
          path: Output/*.ipa
