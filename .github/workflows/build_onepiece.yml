name: Build NxNative IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Environment & Run Script
        run: |
          mkdir -p Output
          
          # แสดงรายการสคริปต์ที่มีทั้งหมดเพื่อตรวจสอบ
          echo "Listing scripts folder:"
          ls -la scripts/ || true
          
          # รันสคริปต์สร้าง IPA ที่มีอยู่ในโปรเจกต์ (รองรับทั้ง python และ bash)
          if [ -f "scripts/build.py" ]; then
            python3 scripts/build.py
          elif [ -f "scripts/ipa.py" ]; then
            python3 scripts/ipa.py
          elif [ -f "scripts/build.sh" ]; then
            bash scripts/build.sh
          elif [ -f "scripts/ipa.sh" ]; then
            bash scripts/ipa.sh
          else
            # ค้นหาไฟล์สคริปต์ python หรือ sh อื่นๆ ในโปรเจกต์
            python3 -m pip install --upgrade pip || true
            find . -maxdepth 3 -name "*.py" -print
          fi

          # ค้นหาไฟล์ .ipa ทั้งหมดที่ถูกสร้างขึ้นในเครื่อง แล้วย้ายมารวมไว้ที่โฟลเดอร์ Output
          find . -name "*.ipa" -not -path "*/Output/*" -exec cp {} Output/ \;
          
          echo "Files in Output:"
          ls -la Output/

      - name: Upload Real IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Release-IPA
          path: Output/*.ipa
