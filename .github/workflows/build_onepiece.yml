name: Build NxNative IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Locate and Build Xcode Project
        run: |
          mkdir -p build Output
          
          # ค้นหาไฟล์ .xcodeproj ทุกซอกทุกมุมในโปรเจกต์
          PROJECT_PATH=$(find . -name "*.xcodeproj" -not -path "*/.*" | head -n 1)
          
          if [ -z "$PROJECT_PATH" ]; then
            echo "Error: No .xcodeproj found anywhere in the repository."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          PROJECT_NAME=$(basename "$PROJECT_PATH")
          SCHEME_NAME=$(basename "$PROJECT_NAME" .xcodeproj)
          
          echo "Found project at: $PROJECT_PATH"
          echo "Project Dir: $PROJECT_DIR, Scheme: $SCHEME_NAME"
          
          cd "$PROJECT_DIR"
          
          # สั่ง Build โค้ดโปรเจกต์
          xcodebuild -project "$PROJECT_NAME" \
                     -scheme "$SCHEME_NAME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath ../build/DerivedData \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

          # แพ็กไฟล์ .app ให้เป็น .ipa
          cd ..
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/*.app build/Payload/
          cd build && zip -r ../Output/NxNative-Release.ipa Payload

      - name: Upload Real IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Release-IPA
          path: Output/*.ipa
