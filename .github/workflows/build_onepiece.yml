name: Build NxNative IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Build NxNative Project & Export IPA
        run: |
          mkdir -p build Output
          
          # ค้นหาไฟล์โปรเจกต์ .xcodeproj อัตโนมัติ
          PROJECT_FILE=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          SCHEME_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
          
          echo "Found project: $PROJECT_FILE with scheme: $SCHEME_NAME"
          
          # สั่ง Build โค้ดโปรเจกต์จริง
          xcodebuild -project "$PROJECT_FILE" \
                     -scheme "$SCHEME_NAME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build/DerivedData \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

          # แพ็กไฟล์ .app เป็น .ipa
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/*.app build/Payload/
          cd build && zip -r ../Output/NxNative-Release.ipa Payload

      - name: Upload Real IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Release-IPA
          path: Output/*.ipa
