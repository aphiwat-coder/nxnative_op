name: Build Emulation App IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build IPA
        run: |
          mkdir -p build
          echo "Simulating IPA compilation" > build/NxNative-Base.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Base-IPA
          path: build/*.ipa
