name: Build NxNative IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Install Dependencies
        run: |
          brew install cmake ninja pkg-config

      - name: Build NxNative Project & Export IPA
        run: |
          mkdir -p build Output
          # สั่งให้ xcodebuild คอมไพล์โปรเจกต์ NxNative ออกมาเป็นแอป iOS
          xcodebuild -workspace NxNative.xcworkspace \
                     -scheme NxNative \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build/DerivedData \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

          # จัดโครงสร้างไฟล์โฟลเดอร์ Payload เพื่อแพ็กเป็นไฟล์ .ipa
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/NxNative.app build/Payload/
          cd build && zip -r ../Output/NxNative-Release.ipa Payload

      - name: Upload Real IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Release-IPA
          path: Output/*.ipa
