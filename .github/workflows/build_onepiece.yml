name: Build NxNative IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Run Official Build Script
        run: |
          # ใช้สคริปต์ build ที่มีอยู่ในโฟลเดอร์ scripts ของโปรเจกต์ seedds/nxnative โดยตรง
          chmod +x scripts/*.sh || true
          
          # รันสคริปต์คอมไพล์เพื่อสร้างไฟล์ IPA
          bash scripts/build.sh || bash scripts/ipa.sh || echo "Trying alternative script"

          # ค้นหาไฟล์ .ipa ที่ถูกสร้างขึ้นมาเก็บไว้ในโฟลเดอร์ Output
          mkdir -p Output
          find . -name "*.ipa" -exec cp {} Output/ \;

      - name: Upload Real IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Release-IPA
          path: Output/*.ipa
